[project]
name = "wsp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jacob Strauss", email = "jacob.d.strauss@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "claude-agent-sdk>=0.2.179",
    "python-dotenv>=1.2.4",
    "tensorflow>=2.22.0rc0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: ship the top-level `wsp` package instead of src/wsp.
module-root = ""
module-name = "wsp"
